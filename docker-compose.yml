# Reviewer path — full bundle. One command:
#   cp .env.example .env && docker compose up
services:
  db:
    image: postgres:16-alpine
    container_name: buena-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-buena}
      POSTGRES_USER: ${POSTGRES_USER:-buena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buena}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-buena}']
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - dbdata:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['pnpm', 'db:migrate:deploy']
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-buena}:${POSTGRES_PASSWORD:-buena}@db:5432/${POSTGRES_DB:-buena}
    depends_on:
      db:
        condition: service_healthy

  seed:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['pnpm', 'db:seed']
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-buena}:${POSTGRES_PASSWORD:-buena}@db:5432/${POSTGRES_DB:-buena}
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: buena-api
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-buena}:${POSTGRES_PASSWORD:-buena}@db:5432/${POSTGRES_DB:-buena}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      CORS_ORIGINS: http://localhost:${WEB_PORT:-3000}
    ports:
      - '${API_PORT:-3001}:3001'
    depends_on:
      seed:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: buena-web
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: http://api:3001
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_started

volumes:
  dbdata:
