name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.0.0

      - name: Setup Node 20
        uses: actions/setup-node@v4.0.4
        with:
          node-version: 20
          cache: pnpm

      - name: Restore Next.js build cache
        uses: actions/cache@v4.2.0
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.{ts,tsx,js,jsx}') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build api
        run: |
          set -euo pipefail
          pnpm --filter @buena/shared build
          pnpm --filter @buena/api build

      - name: Build web and capture bundle output
        run: |
          set -euo pipefail
          pnpm --filter @buena/web build 2>&1 | tee /tmp/build.log

      - name: Print web build log on failure
        if: failure()
        run: |
          echo "::group::web build log"
          cat /tmp/build.log || true
          echo "::endgroup::"

      - name: Bundle budget
        run: node scripts/check-bundle-budget.mjs /tmp/build.log

  e2e-responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.0.0

      - name: Setup Node 20
        uses: actions/setup-node@v4.0.4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        run: pnpm --filter @buena/web exec playwright install --with-deps chromium

      - name: Build shared and web
        run: |
          set -euo pipefail
          pnpm --filter @buena/shared build
          pnpm --filter @buena/web build

      - name: Start web, wait, and run responsive e2e
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
        run: |
          set -euo pipefail
          pnpm --filter @buena/web start > /tmp/web.log 2>&1 &
          WEB_PID=$!
          trap "kill $WEB_PID 2>/dev/null || true" EXIT
          npx -y wait-on http://localhost:3000 -t 60000 || {
            echo "::group::web.log"
            cat /tmp/web.log || true
            echo "::endgroup::"
            exit 1
          }
          pnpm --filter @buena/web exec playwright test e2e/responsive.spec.ts --reporter=list

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-responsive-report
          path: apps/web/playwright-report/
          retention-days: 7