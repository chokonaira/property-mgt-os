# Local development — Postgres only.
# Apps run via `pnpm dev` for hot reload.
services:
  db:
    image: postgres:16-alpine
    container_name: buena-db-dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-buena}
      POSTGRES_USER: ${POSTGRES_USER:-buena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buena}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-buena}']
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - dbdata-dev:/var/lib/postgresql/data

volumes:
  dbdata-dev:
